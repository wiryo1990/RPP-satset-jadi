<!DOCTYPE html>
<html lang="id" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPP SATSET JADI - Pembuat RPP Kurikulum Merdeka</title>
    <script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f3f4f6; }
        .rpp-preview { font-family: 'Times New Roman', Times, serif; font-size: 12pt; color: black; line-height: 1.5; background: white; padding: 40px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 210mm; min-height: 297mm; margin: 0 auto; }
        .rpp-preview h1 { text-align: center; font-size: 14pt; font-weight: bold; margin-bottom: 20px; text-transform: uppercase; border-bottom: 2px solid black; padding-bottom: 10px; }
        .rpp-preview h2 { font-size: 12pt; font-weight: bold; margin-top: 15px; margin-bottom: 10px; color: #1e3a8a; }
        
        /* Tabel Informasi Umum Khusus Web (Tanpa Garis) */
        .info-table { width: 100%; border-collapse: collapse; margin-bottom: 15px; }
        .info-table td { padding: 2px 0; vertical-align: top; }
        .col-label { width: 30%; }
        .col-colon { width: 5%; text-align: center; }
        .col-content { width: 65%; }
        
        /* Loading Spinner */
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; display: inline-block; vertical-align: middle; margin-right: 8px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-7xl mx-auto bg-white rounded-lg shadow-lg flex flex-col md:flex-row">
        
        <!-- KOLOM KIRI: FORM INPUT -->
        <div class="w-full md:w-1/3 bg-blue-50 p-6 border-b md:border-b-0 md:border-r">
            <h2 class="text-xl font-bold text-blue-800 mb-2">RPP SATSET JADI</h2>
            <p class="text-sm text-gray-600 mb-6">Aplikasi pembuat RPP Kurikulum Merdeka berbasis Deep Learning</p>
            
            <form id="rppForm" class="space-y-4 text-sm">
                <div>
                    <label class="block font-semibold mb-1">Nama Penyusun</label>
                    <input type="text" id="namaPenyusun" class="w-full border p-2 rounded" placeholder="Contoh: Wiryo, S.Pd">
                </div>
                <div>
                    <label class="block font-semibold mb-1">Satuan Pendidikan</label>
                    <input type="text" id="sekolah" class="w-full border p-2 rounded" placeholder="Contoh: SD Negeri Teluk Santong">
                </div>
                <div class="flex gap-2">
                    <div class="w-1/2">
                        <label class="block font-semibold mb-1">Fase / Kelas</label>
                        <input type="text" id="faseKelas" class="w-full border p-2 rounded" placeholder="Contoh: Fase A / Kelas 1">
                    </div>
                    <div class="w-1/2">
                        <label class="block font-semibold mb-1">Mata Pelajaran</label>
                        <input type="text" id="mapel" class="w-full border p-2 rounded" placeholder="Contoh: Bahasa Indonesia">
                    </div>
                </div>
                <div>
                    <label class="block font-semibold mb-1">Materi Pelajaran</label>
                    <input type="text" id="materi" class="w-full border p-2 rounded" placeholder="Contoh: Mengenal Perasaan">
                </div>
                <div class="flex gap-2">
                    <div class="w-1/2">
                        <label class="block font-semibold mb-1">Semester</label>
                        <input type="text" id="semester" class="w-full border p-2 rounded" placeholder="Contoh: 1 (Ganjil)">
                    </div>
                    <div class="w-1/2">
                        <label class="block font-semibold mb-1">Tahun Pelajaran</label>
                        <input type="text" id="tahunPelajaran" class="w-full border p-2 rounded" placeholder="Contoh: 2026 / 2027">
                    </div>
                </div>
                <div>
                    <label class="block font-semibold mb-1">Alokasi Waktu</label>
                    <input type="text" id="alokasi" class="w-full border p-2 rounded" placeholder="Contoh: 3 x 35 menit (1 pertemuan)">
                </div>
                <div>
                    <label class="block font-semibold mb-1">Dimensi Profil Lulusan</label>
                    <input type="text" id="profil" class="w-full border p-2 rounded" placeholder="Contoh: Beriman, Bertakwa, Bernalar Kritis">
                </div>
                <div>
                    <label class="block font-semibold mb-1">Mitra Pembelajaran</label>
                    <input type="text" id="mitra" class="w-full border p-2 rounded" placeholder="Contoh: Orang Tua & Lingkungan Sekitar">
                </div>
                <div>
                    <label class="block font-semibold mb-1">Pemanfaatan Digital</label>
                    <input type="text" id="digital" class="w-full border p-2 rounded" placeholder="Contoh: Video Edukasi YouTube">
                </div>
                <div>
                    <label class="block font-semibold mb-1">Tujuan Pembelajaran</label>
                    <textarea id="tujuan" class="w-full border p-2 rounded h-20" placeholder="Contoh: Peserta didik mampu menceritakan pengalaman pribadi..."></textarea>
                </div>
                <div class="border-t border-gray-300 pt-4 mt-4">
                    <p class="font-bold text-gray-700 mb-2">Data Pengesahan</p>
                    <div class="flex gap-2">
                        <div class="w-1/2">
                            <label class="block font-semibold mb-1">Tempat</label>
                            <input type="text" id="tempat" class="w-full border p-2 rounded" placeholder="Contoh: Teluk Santong">
                        </div>
                        <div class="w-1/2">
                            <label class="block font-semibold mb-1">Tanggal</label>
                            <input type="text" id="tanggal" class="w-full border p-2 rounded" placeholder="Contoh: 20 Juli 2026">
                        </div>
                    </div>
                </div>
                
                <button type="submit" id="btnSubmit" class="w-full bg-blue-600 text-white font-bold py-3 rounded hover:bg-blue-700 transition duration-200 mt-4">
                    <span id="btnText">Buat RPP Sekarang</span>
                </button>
            </form>
        </div>

        <!-- KOLOM KANAN: PREVIEW & DOWNLOAD -->
        <div class="w-full md:w-2/3 p-6 bg-gray-200 flex flex-col">
            <div class="flex justify-between items-center mb-4">
                <h3 class="font-bold text-lg text-gray-700">Pratinjau Hasil RPP (Ukuran A4)</h3>
                <button id="btnDownload" onclick="downloadWord()" class="bg-green-600 text-white px-4 py-2 rounded font-bold hover:bg-green-700 hidden">
                    Download MS Word (.docx)
                </button>
            </div>
            
            <div class="overflow-x-auto bg-gray-300 p-4 rounded border">
                <div id="previewArea" class="rpp-preview">
                    <p class="text-center text-gray-400 mt-20">Isi form di sebelah kiri dan klik "Buat RPP Sekarang" untuk menampilkan hasil di sini.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('rppForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const btnSubmit = document.getElementById('btnSubmit');
            const btnText = document.getElementById('btnText');
            const previewArea = document.getElementById('previewArea');
            const btnDownload = document.getElementById('btnDownload');
            
            btnSubmit.disabled = true;
            btnSubmit.classList.add('opacity-75');
            btnText.innerHTML = '<span class="loader"></span> Memproses RPP dengan AI...';
            
            // Mengambil data form dengan fallback jika inputan kosong
            const dataForm = {
                namaPenyusun: document.getElementById('namaPenyusun').value.trim() || "Wiryo, S.Pd",
                sekolah: document.getElementById('sekolah').value.trim() || "SD Negeri Teluk Santong",
                faseKelas: document.getElementById('faseKelas').value.trim() || "Fase A / Kelas 1",
                mapel: document.getElementById('mapel').value.trim() || "Bahasa Indonesia",
                materi: document.getElementById('materi').value.trim() || "Mengenal Perasaan",
                semester: document.getElementById('semester').value.trim() || "1 (Ganjil)",
                tahunPelajaran: document.getElementById('tahunPelajaran').value.trim() || "2026 / 2027",
                alokasi: document.getElementById('alokasi').value.trim() || "3 x 35 menit (1 pertemuan)",
                profil: document.getElementById('profil').value.trim() || "Beriman, Bertakwa & Berakhlak Mulia, Bergotong Royong, Bernalar Kritis, Kreatif",
                mitra: document.getElementById('mitra').value.trim() || "Orang Tua / Wali Murid & Lingkungan Sekitar",
                digital: document.getElementById('digital').value.trim() || "Video Edukasi YouTube & Platform Media Interaktif",
                tujuan: document.getElementById('tujuan').value.trim() || "Peserta didik mampu menceritakan pengalaman pribadi tentang berbagai jenis perasaan dengan suara dan intonasi yang jelas",
                tempat: document.getElementById('tempat').value.trim() || "Teluk Santong",
                tanggal: document.getElementById('tanggal').value.trim() || "20 Juli 2026"
            };

            const systemPrompt = "Anda adalah ahli pembuat Modul Ajar/RPP Kurikulum Merdeka berprinsip Deep Learning. Berikan output langsung berupa format HTML (gunakan tag <p>, <ul>, <ol>, <strong> tanpa membungkusnya dengan tag ```html) KHUSUS untuk bagian II. KOMPONEN INTI (Pemahaman Bermakna, Pertanyaan Pemantik, Kegiatan Pembelajaran Pendahuluan/Inti/Penutup, dan Asesmen).";
            const userPrompt = `Buatkan konten Komponen Inti RPP untuk Mata Pelajaran: ${dataForm.mapel}, Materi: ${dataForm.materi}, Tujuan: ${dataForm.tujuan}, Alokasi Waktu: ${dataForm.alokasi}. Tulis secara rinci dan terstruktur.`;

            try {
                // Endpoint resmi Gemini 1.5 Flash
                const apiKey = "AQ.Ab8RN6LWI_ujD243IlvQVa47evbDC8WNb5cWu3hDJDkJkyxW7axRw";
                const apiUrl = "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=" + apiKey;

                const payload = {
                    contents: [{ parts: [{ text: userPrompt }] }],
                    systemInstruction: { parts: [{ text: systemPrompt }] }
                };

                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    throw new Error("Gagal merespons dari server. Status: " + response.status);
                }

                const result = await response.json();
                let kontenInti = result.candidates[0].content.parts[0].text;
                kontenInti = kontenInti.replace(/```html/g, '').replace(/```/g, '').trim();

                renderRPP(dataForm, kontenInti);
                btnDownload.classList.remove('hidden');

            } catch (error) {
                console.error("Detail Error:", error);
                alert("Terjadi kesalahan koneksi ke AI: " + error.message);
            } finally {
                btnSubmit.disabled = false;
                btnSubmit.classList.remove('opacity-75');
                btnText.innerText = 'Buat RPP Sekarang';
            }
        });

        function renderRPP(data, kontenInti) {
            const previewArea = document.getElementById('previewArea');
            let rppHTML = `
                <h1>RENCANA PELAKSANAAN PEMBELAJARAN (RPP)</h1>
                
                <h2>I. INFORMASI UMUM</h2>
                <table class="info-table">
                    <tr><td class="col-label">Nama Penyusun</td><td class="col-colon">:</td><td class="col-content">${data.namaPenyusun}</td></tr>
                    <tr><td class="col-label">Satuan Pendidikan</td><td class="col-colon">:</td><td class="col-content">${data.sekolah}</td></tr>
                    <tr><td class="col-label">Fase / Kelas</td><td class="col-colon">:</td><td class="col-content">${data.faseKelas}</td></tr>
                    <tr><td class="col-label">Mata Pelajaran</td><td class="col-colon">:</td><td class="col-content">${data.mapel}</td></tr>
                    <tr><td class="col-label">Materi Pelajaran</td><td class="col-colon">:</td><td class="col-content">${data.materi}</td></tr>
                    <tr><td class="col-label">Semester</td><td class="col-colon">:</td><td class="col-content">${data.semester}</td></tr>
                    <tr><td class="col-label">Tahun Pelajaran</td><td class="col-colon">:</td><td class="col-content">${data.tahunPelajaran}</td></tr>
                    <tr><td class="col-label">Alokasi Waktu</td><td class="col-colon">:</td><td class="col-content">${data.alokasi}</td></tr>
                    <tr><td class="col-label">Dimensi Profil Lulusan</td><td class="col-colon">:</td><td class="col-content">${data.profil}</td></tr>
                    <tr><td class="col-label">Mitra Pembelajaran</td><td class="col-colon">:</td><td class="col-content">${data.mitra}</td></tr>
                    <tr><td class="col-label">Pemanfaatan Digital</td><td class="col-colon">:</td><td class="col-content">${data.digital}</td></tr>
                </table>

                <h2>II. KOMPONEN INTI</h2>
                <p><strong>A. Tujuan Pembelajaran:</strong></p>
                <p style="margin-bottom:15px; margin-left:15px;">${data.tujuan}</p>
                
                ${kontenInti}

                <br><br>
                <table style="width: 100%; text-align: center; margin-top: 40px; border: none;">
                    <tr>
                        <td style="width: 50%; padding-bottom: 80px;">Mengetahui,<br>Kepala Sekolah</td>
                        <td style="width: 50%; padding-bottom: 80px;">${data.tempat}, ${data.tanggal}<br>Guru Kelas</td>
                    </tr>
                    <tr>
                        <td style="width: 50%;"><strong>_______________________</strong></td>
                        <td style="width: 50%;"><strong>${data.namaPenyusun}</strong></td>
                    </tr>
                </table>
            `;
            previewArea.innerHTML = rppHTML;
        }

        function downloadWord() {
            const content = document.getElementById('previewArea').innerHTML;
            const header = `
                <html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
                <head><meta charset='utf-8'><title>Export HTML To Doc</title>
                <style>
                    body { font-family: 'Times New Roman', serif; font-size: 12pt; }
                    h1 { text-align: center; font-size: 14pt; font-weight: bold; border-bottom: 2px solid black; padding-bottom: 10px; }
                    h2 { font-size: 12pt; font-weight: bold; color: #1e3a8a; }
                    .info-table { width: 100%; border-collapse: collapse; }
                    .info-table td { padding: 0; margin: 0; mso-space-after: 0pt !important; mso-margin-bottom-alt: 0pt !important; line-height: 1; vertical-align: top; }
                </style>
                </head><body>
            `;
            const footer = "</body></html>";
            const sourceHTML = header + content + footer;

            const blob = new Blob(['\ufeff', sourceHTML], { type: 'application/msword' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'RPP_Kurikulum_Merdeka.doc';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
